services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: casino_cms
      POSTGRES_USER: casino
      POSTGRES_PASSWORD: casino
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino -d casino_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
